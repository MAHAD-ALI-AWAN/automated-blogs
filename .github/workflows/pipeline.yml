name: Auto Blog Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'  # Har 2 ghante baad chalega
  workflow_dispatch:        # Manual run karne ka option bhi rahega

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Run Pipeline
        run: |
          python pipeline.py

      - name: Commit and Push Changes (Blog & DB updates)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Automated blog post update from GitHub Actions" || echo "No changes to commit"
          git push